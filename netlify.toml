# Netlify build. Production uses the site's primary URL (custom domain once set),
# previews use their own URL so links work there too.
[build]
  publish = "public"
  command = "hugo --gc --minify -b $URL"

[build.environment]
  HUGO_VERSION = "0.148.1"
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Cookieless visit counter: two functions served at /api/hit and /api/stats (paths set in the function files).
# Set STATS_TOKEN (required for /api/stats; letters and digits only, e.g. `openssl rand -hex 32`) and optionally HIT_SECRET
# in the site's environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
