  person-task: { v: izpilda, p: piešķirts, why: Darbs nonāk pie konkrēta cilvēka. }
  role-risk: { v: pārvalda, p: pārvalda, why: Katram riskam ir atbildīgais. }
  role-control: { v: pārvalda, p: pārvalda, why: Katrai kontrolei ir izpildītājs. }
  role-asset: { v: pārvalda, p: pārvalda, why: Katram aktīvam ir biznesa un tehniskais īpašnieks. }
  role-incident: { v: vada, p: vada, why: Skaidrs incidentu vadītājs un reaģētāji. }
  role-plan: { v: atbild par, p: atbild, why: Katrai programmai ir viena atbildīgā loma. }
  role-document: { v: noteikta, p: nosaka, why: Pienākumi ir pierakstīti. }

questions:
  supplier-fails: { q: "Galvenais piegādātājs nedarbojas. Ko tas skar un kas mūs aizsargā?", a: "No piegādātāja uz pakalpojumiem, ko tas nodrošina, un visu, kas no tiem atkarīgs, uz riskiem šiem pakalpojumiem un kontrolēm, kas tos mazina." }
  prove-clause: { q: "Vai šodien varam pierādīt šo ISO 27001 punktu?", a: "No punkta uz kontrolēm, kas to izpilda, un uz to pierādījumiem. Novecojuši pierādījumi parādās kā nepilnība, pirms to atrod auditors." }
  owner-left: { q: "Mūsu CISO aizgāja. Kam tagad pieder viņas kontroles un riski?", a: "Īpašumtiesības ir lomai, nevis cilvēkam. Piešķiriet lomu pēctecim, un visi ieraksti seko." }
  incident-risks: { q: "Kurus riskus šis incidents īstenoja?", a: "No incidenta uz skartajiem aktīviem un īstenotajiem riskiem, augšup uz uzņēmuma līmeņa risku, uz kontrolēm, kurām vajadzēja nostrādāt, un turpmākajiem uzdevumiem." }
  threat-news: { q: "Jauni draudu jaunumi. Vai tie attiecas uz mums?", a: "No signāla uz draudiem, uz vājumiem, ko tie izmanto, uz aktīviem, kuros tie ir, un riskiem, ko tie palielina." }
  finding-closed: { q: "Vai pagājušā gada audita konstatējums ir slēgts?", a: "No audita uz konstatējumu, uz korektīvo uzdevumu un pierādījumu, ka tas izdarīts, uz secinājumu par punktu." }

gaps:
  risk-no-control: { t: Risks bez kontroles, m: "Neapstrādāts apdraudējums vai pieņemšana, ko neviens nav reģistrējis." }
  control-no-evidence: { t: Kontrole bez derīga pierādījuma, m: "Deklarēta, bet nav pierādīts, ka darbojas. Novecojis pierādījums ir kā nekāds." }
  requirement-no-control: { t: Prasība bez kontroles, m: "Atbilstības nepilnība, redzama pirms audita." }
  no-owner: { t: Ieraksts bez īpašnieka lomas, m: Neviens par to neatbild. }
