  audit-asset: { v: tvērumā, p: tvērumā, why: Viens audits var aptvert vairākus produktus, katru ar savām kontrolēm. }
  audit-supplier: { v: novērtē, p: novērtēts, why: Piegādātāju novērtēšana izmanto audita metodi. }
  audit-requirement: { v: pārbauda, p: pārbaudīta, why: Audita tvērums ir izsekojams līdz punktiem. }
  audit-control: { v: pārbauda, p: pārbaudīta, why: Deklarētais un darbībā esošais tiek pārbaudīts kopā. }
