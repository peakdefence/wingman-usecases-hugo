  finding-task: { v: novērsts ar, p: novērš, why: Korektīvā darbība tiek izsekota līdz slēgšanai. }
  evidence-finding: { v: pamato, p: pamatots ar, why: Katrs konstatējums norāda, uz ko tas balstās. }
  document-asset: { v: aptver, p: aptverts, why: "Novērtējumi (DPIA, BIA, izmaiņas) reģistrē, ko tie aptver." }
  document-task: { v: rada, p: no, why: Lēmumi protokolos un novērtējumos kļūst par darbu. }
  plan-audit: { v: plāno, p: plānots, why: Audita programma ir gada kalendārā. }
  plan-risk: { v: pārskata, p: pārskatīts, why: Risku pārskatīšana ir plānota, nevis jāatceras. }
  plan-asset: { v: pārskata, p: pārskatīts, why: Aktīvu un piegādātāju pārskatīšana notiek laikā. }
  plan-document: { v: pārskata, p: pārskatīts, why: Politikas tiek pārskatītas savā ciklā. }
