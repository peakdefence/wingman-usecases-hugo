# Home page structure. Texts are in i18n/<lang>.toml:
#   situations: sit_<id>_t (the visitor's problem), sit_<id>_p (what WINGMAN does), the link label is the target page's `short`
#   promises:   prom_<id>_t, prom_<id>_p
# `page` is the page a situation card opens. `use_cases` lists use-case ids shown under a promise;
# every use case should appear under exactly one promise.

situations:
  - { id: start, page: /for/start }
  - { id: accountable, page: /for/board }
  - { id: alone, page: /for/solo }
  - { id: team, page: /for/ciso }
  - { id: moving, page: /for/ciso }
  - { id: auditor, page: /for/auditor }
  - { id: consultant, page: /for/consultant }

promises:
  - { id: knowledge, model: true, use_cases: [roles-raci, new-requirements] }
  - { id: projects, use_cases: [risk-identification, business-impact-analysis, auditing, audit-scopes, eu-ai-act, gdpr-dpia] }
  - { id: regular, use_cases: [regular-reviews, risk-review, supplier-evaluation, management-review, security-operations] }
  - { id: events, use_cases: [incident-handling, vulnerability-impact, change-management] }
