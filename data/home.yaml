# Home page structure. Texts are in i18n/<lang>.toml:
#   situations: sit_<id>_t (the visitor's problem), sit_<id>_p (what WINGMAN does), the link label is the target page's `short`
#   promises:   prom_<id>_t, prom_<id>_p
# `page` is the page a situation card opens. `use_cases` lists use-case ids shown under a promise;
# every use case should appear under exactly one promise.

situations:
  - { id: start, icon: start, page: /for/start }
  - { id: accountable, icon: briefcase, page: /for/board }
  - { id: alone, icon: person, page: /for/solo }
  - { id: team, icon: shield, page: /for/ciso }
  - { id: moving, icon: pulse, page: /for/ciso }
  - { id: auditor, icon: search, page: /for/auditor }
  - { id: consultant, icon: people, page: /for/consultant }

promises:
  - { id: knowledge, icon: record, model: true, use_cases: [roles-raci, new-requirements] }
  - { id: projects, icon: flag, use_cases: [risk-identification, business-impact-analysis, auditing, audit-scopes, eu-ai-act, gdpr-dpia] }
  - { id: regular, icon: calendar, use_cases: [regular-reviews, risk-review, supplier-evaluation, management-review, security-operations] }
  - { id: events, icon: bell, use_cases: [incident-handling, vulnerability-impact, change-management] }
