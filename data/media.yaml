# Media library: screenshots and short recordings of WINGMAN, one entry per capture.
# Read MEDIA.md before adding or changing entries.
#
#   id:        stable key; use-case stages reference it (media: [..]) and the library page lists it
#   file:      path under static/ (media/<id>.<ext>); png/jpg for stills, gif/mp4 for actions
#   type:      image | gif | video
#   area:      WINGMAN screen: brief | plans | tasks | risks | controls | requirements | assets |
#              vulnerabilities | incidents | signals | threats | documents | audits | graph | ask |
#              palette | settings | email
#   action:    true when the capture shows the user doing something (a flow), false for a state
#   entities:  entity ids from data/graph.yaml that the capture shows
#   sequence:  optional group key + step for stills that belong to one flow (shown in order)
#   env:       tenant the capture came from (dev | stage); records named in captions exist there
#   width/height: pixel size of the file, so the page keeps its layout while loading
#   title / caption: per language; a missing language falls back to en
#   status:    omit when the file is in static/media; "pending" when the entry is planned or the
#              file still has to be dropped in (the layout skips pending entries)

