  area: ask
  action: true
  entities: [incident, asset, threat, task]
  env: stage
  width: 960
  height: 748
  title: { en: "Triage with the incident handler", lv: "Triāža kopā ar incidenta apstrādātāju" }
  caption:
    en: "The assigned handler asks for severity, reporting obligations and next-hour decisions. The Incident Management skill runs eleven steps and ends with suggestions: link the two candidate source systems, create the missing threat, and six remediation tasks. The handler accepts or rejects each."
    lv: "Nozīmētais apstrādātājs prasa smagumu, ziņošanas pienākumus un nākamās stundas lēmumus. Incidentu pārvaldības prasme izpilda vienpadsmit soļus un beidz ar ieteikumiem: sasaistīt divas iespējamās avota sistēmas, izveidot trūkstošo draudu un sešus novēršanas uzdevumus. Apstrādātājs katru pieņem vai noraida."

- id: ask-skill-incident-triage-1-steps
  file: media/ask-skill-incident-triage-1-steps.jpg
  type: image
  area: ask
  action: false
  entities: [incident]
  env: stage
  sequence: { key: ask-skill-incident-triage, step: 1 }
  width: 1232
  height: 960
  title: { en: "Eleven steps, severity Critical", lv: "Vienpadsmit soļi, smagums Kritisks" }
  caption:
    en: "Company context, intake, severity classification, evidence and duplicates, response plan, suggestions, findings, next-hour decisions, draft notifications, interim post-mortem, brief update. Then what is required: no regulatory obligation recorded yet, GDPR 72 h clock only if Legal confirms a breach, customer notice required now."
    lv: "Uzņēmuma konteksts, pieņemšana, smaguma klasifikācija, pierādījumi un dublikāti, reaģēšanas plāns, ieteikumi, atzinumi, nākamās stundas lēmumi, paziņojumu uzmetumi, pagaidu pēcanalīze, kopsavilkuma atjaunošana. Tad, kas nepieciešams: regulatīvs pienākums vēl nav reģistrēts, GDPR 72 h termiņš tikai ja juristi apstiprina pārkāpumu, klientu paziņojums vajadzīgs tūlīt."

