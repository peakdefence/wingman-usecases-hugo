    lv: "Vienkāršos vārdos uz incidenta pajautāts, WINGMAN aizpilda GDPR 33. panta paziņojumu no ieraksta: pārkāpuma būtība, datu subjekti, datu kategorijas, DAS kontakts, iespējamās sekas, veiktie pasākumi, saziņa ar datu subjektiem, citi paziņojumi. Katrs lauks atzīmēts kā ZINĀMS, NEZINĀMS vai PIEŅEMTS."

