  title: { en: "The Brief: state of the programme", lv: "Pārskats: programmas stāvoklis" }
  caption:
    en: "Every morning WINGMAN writes the state of the programme from the records: where risk concentrates, coverage and control, a watch list and the tensions between groups of records."
    lv: "Katru rītu WINGMAN no ierakstiem uzraksta programmas stāvokli: kur koncentrējas risks, pārklājums un kontrole, novērošanas saraksts un pretrunas starp ierakstu grupām."

