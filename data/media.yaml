  width: 1105
  height: 1092
  title: { en: "Gaps to close and the organisation's temperature", lv: "Novēršamās nepilnības un organizācijas temperatūra" }
  caption:
    en: "Eleven register checks run on every record: risks without an owner or score, requirements without a control, tasks overdue by more than 30 days, vulnerabilities past the patching SLA, unapproved documents. Each gap links to the records behind it."
