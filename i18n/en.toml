prom_eyebrow = "What WINGMAN does"
prom_title = "One record, and four kinds of work on it"
prom_lede = "AI assistants connect to WINGMAN over MCP, an open standard for giving assistants access to tools and data. A skill is a procedure the assistant follows step by step on your records."
prom_knowledge_t = "Keeps your security knowledge current"
prom_knowledge_p = "Requirements, assets, risks, controls, suppliers, roles and evidence are linked records, each stored once. Every project, review and incident updates the same records, so your assistant answers from the current state, not from whatever was pasted into the chat."
prom_projects_t = "Runs implementation and improvement projects"
prom_projects_p = "Skills take you through a new standard, a risk interview, a business impact analysis or an internal audit. Planning a framework implementation, from scope to tasks for each person and the policies they follow, takes days instead of months. The assistant reads the record and proposes changes; you accept them."
prom_regular_t = "Keeps routine work on schedule"
prom_regular_p = "Reviews of risks, policies, suppliers and access follow a calendar. Owners get reminders, evidence shows when it is about to expire, and the management review is assembled from the records."
prom_events_t = "Prepares the response to what was not planned"
prom_events_p = "A scanner result, a supplier notice or threat news arrives as a signal. WINGMAN shows which assets and risks it touches and proposes the next step, including drafts of the reports that have deadlines. People decide and act."
prom_all = "All use cases"

