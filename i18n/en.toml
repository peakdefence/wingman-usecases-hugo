hero_eyebrow = "WINGMAN by Peak Defence"
hero_title = "The persistent security brain behind your AI assistants"
hero_lede = "WINGMAN keeps what your organisation knows about its security and compliance as one linked, current record. Claude, ChatGPT and other AI assistants work on that record: they run improvement projects, keep routine work on schedule and prepare the next step when an incident or a vulnerability arrives. AI proposes and people decide."
compare_left_t = "Separate registers"
compare_left = "A risk register, a control matrix, an asset list, an audit tracker. Each copies a little of the others and drifts apart."
compare_right_t = "With WINGMAN"
compare_right = "Every record exists once and is linked to the rest. Assistants read it and propose changes, a named person accepts each one, and the record stays current because all the work runs on it."

hero_cta_sit = "Find your situation"
hero_cta_prom = "What WINGMAN does"
compare_ai_t = "An AI assistant alone"
compare_ai = "Every chat starts from pasted context and forgets it afterwards. Nothing records who decided what."

sit_eyebrow = "Where you are"
sit_title = "Which of these is your situation?"
sit_lede = "Security governance looks different depending on who has to carry it. Pick the one closest to you."
sit_start_t = "A customer asks for ISO 27001, and we have no security team"
sit_start_p = "Start from the requirements and from what you already run. Your AI assistant drafts the scope, risks, controls and policies with you, one step at a time, and you confirm each one."
sit_accountable_t = "I am accountable for security and cannot judge where we stand"
sit_accountable_p = "A management review prepared from the records shows what changed, what is overdue and what needs your decision. Your approvals are kept with their dates."
sit_alone_t = "I look after security alone, next to another job"
sit_alone_p = "Reviews come round by calendar, not by memory. Reports for the regulator are prepared from the records, not written from nothing each time."
sit_team_t = "Our registers drift apart, and much of the programme is in my head"
sit_team_p = "Every record exists once and belongs to a role, so the programme survives a change of staff. A check across all records lists what has drifted, such as a risk with no control or a control with no valid evidence."
sit_moving_t = "We are certified, but the risk register only moves before an audit"
sit_moving_p = "Scanner findings and supplier notices arrive as signals, linked to the assets and risks they touch. Your assistant proposes the rating change with its reasoning, and a named person accepts it."
sit_auditor_t = "I audit, and every statement must trace to its evidence"
sit_auditor_p = "You get the claimed controls with paragraph references before fieldwork. Finding, evidence and conclusion stay linked, and the auditor confirms or changes each finding."
sit_consultant_t = "I run security programmes for several organisations"
sit_consultant_p = "Run the same procedure, such as a risk interview, a business impact analysis or an audit, from your AI assistant against each organisation's own record."

