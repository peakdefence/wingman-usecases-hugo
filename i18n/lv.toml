prom_eyebrow = "Ko dara WINGMAN"
prom_title = "Vienoti ieraksti, četri darba veidi"
prom_lede = "MI asistenti pieslēdzas WINGMAN ar MCP, atvērtu standartu, kas dod asistentiem piekļuvi rīkiem un datiem. Prasme ir procedūra, ko asistents soli pa solim izpilda ar jūsu ierakstiem."
prom_knowledge_t = "Uztur jūsu drošības zināšanas aktuālas"
prom_knowledge_p = "Prasības, aktīvi, riski, kontroles, piegādātāji, lomas un pierādījumi ir sasaistīti ieraksti, katrs glabāts vienreiz. Katrs projekts, pārskatīšana un incidents atjaunina tos pašus ierakstus, tāpēc asistents atbild no aktuālā stāvokļa, nevis no tā, kas iekopēts sarunā."
prom_projects_t = "Vada ieviešanas un uzlabojumu projektus"
prom_projects_p = "Prasmes izved cauri jaunam standartam, risku intervijai, darbības ietekmes analīzei vai iekšējam auditam. Asistents lasa ierakstus un ierosina izmaiņas, un jūs tās apstiprināt."
prom_regular_t = "Nodrošina, ka regulārie darbi notiek laikā"
prom_regular_p = "Risku, politiku, piegādātāju un piekļuves pārskatīšanas notiek pēc kalendāra. Īpašnieki saņem atgādinājumus, ir redzams, kuriem pierādījumiem beidzas derīguma termiņš, un vadības pārskats tiek salikts no ierakstiem."
prom_events_t = "Sagatavo rīcību neplānotajam"
prom_events_p = "Skenera rezultāts, piegādātāja paziņojums vai brīdinājums par apdraudējumiem ienāk kā signāls. WINGMAN parāda, kurus aktīvus un riskus tas skar, un ierosina nākamo soli, tostarp ziņojumu melnrakstus ar noteiktiem termiņiem. Izlemj un rīkojas cilvēki."
