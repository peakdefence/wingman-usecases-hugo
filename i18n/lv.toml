hero_eyebrow = "WINGMAN no Peak Defence"
hero_title = "Pastāvīgas drošības smadzenes aiz jūsu MI asistentiem"
hero_lede = "WINGMAN glabā to, ko organizācija zina par savu drošību un atbilstību, kā vienu sasaistītu un aktuālu ierakstu kopumu. Claude, ChatGPT un citi MI asistenti strādā ar šiem ierakstiem: vada uzlabojumu projektus, uztur regulāros darbus grafikā un palīdz ar incidentiem un ievainojamībām, kad tie parādās. MI ierosina, cilvēki izlemj."
compare_left_t = "Atsevišķi reģistri"
compare_left = "Risku reģistrs, kontroļu matrica, aktīvu saraksts, auditu uzskaite. Katrs nedaudz kopē citus, un tie pamazām atšķiras."
compare_right_t = "WINGMAN aiz abiem"
compare_right = "Katrs ieraksts eksistē vienreiz, ir sasaistīts ar pārējiem un tiek uzturēts aktuāls. Asistenti to lasa un ierosina izmaiņas, un katru apstiprina konkrēts cilvēks."

hero_cta_sit = "Atrodiet savu situāciju"
hero_cta_prom = "Ko dara WINGMAN"
compare_ai_t = "MI asistents viens pats"
compare_ai = "Katra saruna sākas ar iekopētu kontekstu un pēc tam to aizmirst. Nekur nav pierakstīts, kurš ko izlēma."

sit_eyebrow = "Kur jūs esat"
sit_title = "Kura no šīm ir jūsu situācija?"
sit_lede = "Drošības pārvaldība izskatās citādi atkarībā no tā, kam tā jānes. Izvēlieties sev tuvāko."
sit_start_t = "Klients prasa ISO 27001, bet mums nav drošības komandas"
sit_start_p = "Sāciet no prasībām un no tā, kas jums jau darbojas. MI asistents kopā ar jums soli pa solim sagatavo tvērumu, riskus, kontroles un politikas, un jūs apstiprināt katru."
sit_start_go = "ISO 27001 un SOC 2 ar WINGMAN"
sit_accountable_t = "Es atbildu par drošību, bet nevaru novērtēt, kādā stāvoklī esam"
sit_accountable_p = "Vadības pārskats, kas sagatavots no ierakstiem, parāda, kas mainījies, kas kavējas un kas jāizlemj jums. Jūsu apstiprinājumi tiek saglabāti ar datumiem."
sit_accountable_go = "Vadības pārskats"
sit_alone_t = "Par drošību rūpējos viens, līdztekus citam darbam"
sit_alone_p = "Pārskatīšanas notiek pēc kalendāra, nevis pēc atmiņas. Ziņojumi uzraugam tiek sagatavoti no ierakstiem, nevis katru reizi rakstīti no nulles."
sit_alone_go = "NIS2 ar WINGMAN"
sit_team_t = "Mūsu reģistri pamazām atšķiras, un liela daļa programmas ir manā galvā"
sit_team_p = "Katrs ieraksts eksistē vienreiz un pieder lomai, tāpēc programma pārdzīvo cilvēku maiņu. Skeneru rezultāti un piegādātāju paziņojumi maina riskus arī starp pārskatīšanām."
sit_team_go = "Drošības operāciju vadība"
sit_auditor_t = "Es auditēju, un katram apgalvojumam jābūt izsekojamam līdz pierādījumam"
sit_auditor_p = "Pirms audita uz vietas saņemat deklarētās kontroles ar atsaucēm uz dokumentu punktiem. Konstatējums, pierādījums un secinājums paliek sasaistīti, un auditors apstiprina vai maina katru konstatējumu."
sit_auditor_go = "Auditēšana"
sit_consultant_t = "Es vadu drošības programmas vairākām organizācijām"
sit_consultant_p = "Veiciet vienu un to pašu procedūru, piemēram, risku interviju, darbības ietekmes analīzi vai auditu, no sava MI asistenta ar katras organizācijas pašas ierakstiem."
sit_consultant_go = "Risku identificēšana"

prom_eyebrow = "Ko dara WINGMAN"
prom_title = "Vieni ieraksti un četri darba veidi ar tiem"
prom_lede = "MI asistenti pieslēdzas WINGMAN ar MCP, atvērtu standartu, kas dod asistentiem piekļuvi rīkiem un datiem. Prasme ir procedūra, ko asistents soli pa solim izpilda ar jūsu ierakstiem."
prom_knowledge_t = "Uztur jūsu drošības zināšanas aktuālas"
prom_knowledge_p = "Prasības, aktīvi, riski, kontroles, piegādātāji, lomas un pierādījumi ir sasaistīti ieraksti, katrs glabāts vienreiz. Asistents atbild no ierakstiem, nevis no tā, kas iekopēts sarunā."
prom_projects_t = "Vada ieviešanas un uzlabojumu projektus"
prom_projects_p = "Prasmes izved cauri jaunam standartam, risku intervijai, darbības ietekmes analīzei vai iekšējam auditam. Asistents lasa ierakstus un ierosina izmaiņas, un jūs tās apstiprināt."
prom_regular_t = "Uztur regulāros darbus grafikā"
prom_regular_p = "Risku, politiku, piegādātāju un piekļuves pārskatīšanas notiek pēc kalendāra. Īpašnieki saņem atgādinājumus, pierādījumi parāda, kad tuvojas to termiņš, un vadības pārskats tiek salikts no ierakstiem."
prom_events_t = "Tiek galā ar neplānoto"
prom_events_p = "Skenera rezultāts, piegādātāja paziņojums vai ziņa par draudiem ienāk kā signāls. WINGMAN parāda, kurus aktīvus un riskus tas skar, un ierosina nākamo soli, arī ziņojumus, kam ir termiņi."
