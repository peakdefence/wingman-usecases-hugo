<!doctype html>
<html lang="{{ site.Language.LanguageCode | default site.Language.Lang }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">{{ i18n "skip" }}</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/main.js" | js.Build (dict "minify" true) | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
